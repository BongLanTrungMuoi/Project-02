name: recommendation service ci

on:
  push:
    branches-ignore:
      - "rc_v*"
    tags-ignore:
      - "rc_v*"
    paths:
      - "recommendation/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/recommendation-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: ["main"]
    paths:
      - "recommendation/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/recommendation-ci.yaml"
      - "pom.xml"
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions
      - name: Run Maven Build Command
        run: mvn clean install -pl recommendation -am
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Tag
        run: |
          echo "DOCKER_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./recommendation
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-recommendation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-recommendation:${{ env.DOCKER_SHA }}